# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_megatron_trainer
  - omni/model@actor_rollout_ref.model: omni_model
  - _self_

# Config for actor, rollout and reference model.
actor_rollout_ref:

  # Keep Megatron training resources separate from standalone rollout replicas.
  hybrid_engine: false

  # Model config.
  model:

    # Dispatch to OmniMindSpeedMegatronEngine via omni_model + mindspeed_megatron
    model_type: omni_model

  # Actor config.
  actor:

    # Use MindSpeed Megatron as the actor backend.
    strategy: mindspeed_megatron

    # MindSpeed-specific configuration.
    mindspeed:

      # Use the old mbridge for model config conversion.
      use_mbridge: true

      # NPU only supports the old mbridge (vanilla_mbridge=True).
      vanilla_mbridge: true

      # Tensor model parallelism size.
      tensor_model_parallel_size: 4

      # Pipeline model parallelism size.
      pipeline_model_parallel_size: 2

      # Expert model parallelism size.
      expert_model_parallel_size: 1

      # Enable parameter offloading to CPU.
      param_offload: true

      # Enable optimizer offloading to CPU.
      optimizer_offload: true

      # Enable gradient offloading to CPU.
      grad_offload: true

      # Additional mcore arguments passed to MindSpeed.
      mcore_kwargs:
        spec: '[mindspeed_llm.tasks.models.spec.qwen3_spec, layer_spec]'
        qk_layernorm: true
        position_embedding_type: rope
        normalization: RMSNorm
        disable_bias_linear: true
        swiglu: true
        use_flash_attn: true
        use_fused_rotary_pos_emb: true
        use_fused_swiglu: true
        use_fused_rmsnorm: true
        sequence_parallel: true
        group_query_attention: true
        attention_softmax_in_fp32: true
        seq_length: 10240
        micro_batch_size: 1
        transformer_impl: transformer_engine
        recompute_method: uniform
        recompute_granularity: full
        recompute_num_layers: 1

  # Rollout config.
  rollout:

    # Use vLLM-Omni as the rollout backend for omni models on NPU.
    # vLLM-Omni is the standard rollout backend in verl-omni for Qwen3-Omni.
    name: vllm_omni

    # Use the asynchronous server rollout path.
    mode: async

    # A standalone vLLM-Omni server owns one data-parallel replica.
    data_parallel_size: 1

    # Calculate token log probabilities during rollout.
    calculate_log_probs: true

    # Checkpoint engine configuration.
    checkpoint_engine:

      # Use NCCL to synchronize Megatron weights to rollout replicas.
      backend: nccl

    # Backend-specific engine arguments.
    engine_kwargs:

      # vLLM-Omni engine arguments.
      vllm_omni:

        # Use autoregressive output for text-token rollout.
        output_mode: ar

  # Reference model config.
  ref:

    # Use MindSpeed Megatron as the reference backend.
    strategy: mindspeed_megatron

    # Reference model shares the same mindspeed config as actor.
    mindspeed:
      use_mbridge: true
      vanilla_mbridge: true
      tensor_model_parallel_size: 4
      pipeline_model_parallel_size: 2
      expert_model_parallel_size: 1
      param_offload: true
      optimizer_offload: true
      grad_offload: true
      mcore_kwargs:
        spec: '[mindspeed_llm.tasks.models.spec.qwen3_spec, layer_spec]'
        qk_layernorm: true
        position_embedding_type: rope
        normalization: RMSNorm
        disable_bias_linear: true
        swiglu: true
        use_flash_attn: true
        use_fused_rotary_pos_emb: true
        use_fused_swiglu: true
        use_fused_rmsnorm: true
        sequence_parallel: true
        group_query_attention: true
        attention_softmax_in_fp32: true
        seq_length: 10240
        micro_batch_size: 1
        transformer_impl: transformer_engine

# Reward configuration.
reward:

  # Reward manager configuration.
  reward_manager:

    # Resolve the built-in verl reward manager registry.
    source: register

    # Use the standard text reward manager by default.
    name: naive

# Algorithm configuration.
algorithm:

  # Rollout correction configuration.
  rollout_correction:

    # Use rollout log probabilities directly.
    bypass_mode: true